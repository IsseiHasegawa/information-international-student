services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: StudentInformation
      POSTGRES_USER: studentapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentapp -d StudentInformation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: StudentInformation
      PGUSER: studentapp
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  checker:
    build: .
    command: ["python", "-u", "backend/src/scheduler.py"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: StudentInformation
      PGUSER: studentapp
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CHECK_TIMEZONE: ${CHECK_TIMEZONE:-America/Chicago}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
